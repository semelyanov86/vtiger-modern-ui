<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <include ignore_missing="no">/etc/fonts/fonts.conf</include>
  <!-- Keep the accepted fallback for symbols absent from Arial/Noto Sans. Chromium otherwise
       selects either Noto Sans Math or DejaVu Sans depending on the system font inventory. -->
  <match target="pattern">
    <test name="family" qual="first"><string>Arial</string></test>
    <edit name="family" mode="assign_replace" binding="strong">
      <string>Arial</string><string>Noto Sans Math</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="first"><string>Noto Sans</string></test>
    <edit name="family" mode="assign_replace" binding="strong">
      <string>Noto Sans</string><string>Noto Sans Math</string>
    </edit>
  </match>
  <!-- Chromium also searches the complete font inventory for missing glyphs. Limit this
       process to the accepted system faces; downloaded application fonts are unaffected. -->
  <selectfont>
    <rejectfont><pattern/></rejectfont>
    <acceptfont>
      <pattern><patelt name="postscriptname"><string>ArialMT</string></patelt></pattern>
      <pattern><patelt name="postscriptname"><string>Arial-BoldMT</string></patelt></pattern>
      <pattern><patelt name="postscriptname"><string>NotoSans-Regular</string></patelt></pattern>
      <pattern><patelt name="postscriptname"><string>NotoSans-Bold</string></patelt></pattern>
      <pattern><patelt name="postscriptname"><string>NotoSansMath-Regular</string></patelt></pattern>
      <pattern><patelt name="postscriptname"><string>CourierNewPS-BoldMT</string></patelt></pattern>
      <pattern><patelt name="postscriptname"><string>DejaVuSansMono</string></patelt></pattern>
    </acceptfont>
  </selectfont>
</fontconfig>
