# The only published entry of the clean stand: the web servers sit on an internal network without a route
# to the internet. Host (with the port) is passed through: the installer derives site_URL from it.
client_max_body_size 64m;
proxy_read_timeout 900s;
proxy_send_timeout 900s;
proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_buffering off;

server {
	listen 8081;
	location / { proxy_pass http://web81:80; }
}

server {
	listen 8085;
	location / { proxy_pass http://web85:80; }
}

server {
	listen 8025;
	location / {
		proxy_pass http://mail:8025;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
	}
}
