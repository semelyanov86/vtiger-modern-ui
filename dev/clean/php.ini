; PHP settings of the clean stand: what the Vtiger 8.4.0 installer recommends (Install_Utils_Model), errors
; logged to the container log (docker compose logs), never shown in pages.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL
max_execution_time = 0
memory_limit = 512M
upload_max_filesize = 32M
post_max_size = 32M
output_buffering = 4096
short_open_tag = Off
date.timezone = UTC
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
