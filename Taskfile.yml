version: '3'

# ModernUI: installable extension module with a new interface for Vtiger 8.4 (Vue 3 + Vite).
# DEV: the sources of src/ are bind-mounted read-only into a local Vtiger 8.4 instance chosen in .env
# (.env.example, docs/DEVELOPMENT.md). PACKAGE: the ZIP of `task package`, imported by the Module Manager.

dotenv: ['.env']

vars:
  VERSION:
    sh: cat VERSION
  ZIP: 'dist/ModernUI-{{if .MU_VERSION}}{{.MU_VERSION}}{{else}}{{.VERSION}}{{end}}.zip'
  # Lower bound of PHP for the module (composer.json of Vtiger 8.4.0), pinned by digest.
  PHP81_IMAGE: php:8.1-cli@sha256:76e563191d1ade120313a8736df24154d21da5155c0756f147c0b01bd19d9087
  ESLINT: npx eslint --flag unstable_native_nodejs_ts_config

tasks:
  fe:install:
    desc: Install the frontend dependencies exactly as locked (npm ci, no install scripts)
    dir: frontend
    sources: [package.json, package-lock.json]
    generates: [node_modules/.package-lock.json]
    cmd: npm ci --ignore-scripts

  build:
    desc: Production build of the frontend into src/layouts/v7/modules/ModernUI/resources/dist (atomic manifest switch)
    deps: [fe:install]
    dir: frontend
    cmd: npx vite build

  dev:
    desc: Watch mode for the dev instance - rebuilds on every change, the manifest is switched last; reload the page
    deps: [fe:install]
    dir: frontend
    cmd: npx vite build --watch

  package:
    desc: lint, build, then the installable ZIP in dist/ with its SHA-256 and file list (version from VERSION or MU_VERSION)
    cmds:
      - task: lint
      - task: build
      - python3 packaging/build-zip.py {{if .MU_VERSION}}--version {{.MU_VERSION}}{{end}}

  lint:
    desc: php -l under PHP 8.5, 8.4 and 8.1 (Docker); vue-tsc, ESLint with zero warnings, ES5 syntax of loader.js
    cmds:
      - task: lint:php
      - task: lint:frontend

  lint:php:
    silent: true
    cmds:
      - for: [php8.5, php8.4]
        cmd: |
          files=$(git ls-files --cached --others --exclude-standard '*.php')
          [ -n "$files" ] || { echo "no PHP files"; exit 0; }
          errors=$(echo "$files" | xargs -n1 -P4 {{.ITEM}} -l 2>&1 | grep -v '^No syntax errors' || true)
          [ -z "$errors" ] || { echo "$errors"; exit 1; }
          echo "{{.ITEM}}: $(echo "$files" | wc -l) file(s) ok"
      - |
        files=$(git ls-files --cached --others --exclude-standard '*.php')
        errors=$(echo "$files" | docker run --rm -i -v "$PWD":/app:ro -w /app {{.PHP81_IMAGE}} xargs -n1 php -l 2>&1 | grep -v '^No syntax errors' || true)
        [ -z "$errors" ] || { echo "$errors"; exit 1; }
        echo "php 8.1 (Docker): $(echo "$files" | wc -l) file(s) ok"

  lint:frontend:
    deps: [fe:install]
    dir: frontend
    cmds:
      - npx vue-tsc --build --force
      - '{{.ESLINT}} --max-warnings 0 .'
      - npx acorn --ecma5 --silent ../src/layouts/v7/modules/ModernUI/resources/loader.js
      - npx acorn --ecma5 --silent ../src/layouts/v7/modules/ModernUI/resources/auth.js
      - echo "frontend - types, ESLint, ES5 loader ok"

  test:
    desc: All automated checks without a browser - PHP models, migrations on a throwaway MySQL, i18n, frontend unit tests, package
    cmds:
      - task: build
      - task: test:php
      - task: test:db
      - task: test:frontend
      - task: test:package

  test:php:
    desc: PHP unit tests (settings, locales, activation, assets, i18n parity) under PHP 8.5, 8.4 and 8.1
    cmds:
      - php8.5 tests/php/run.php
      - php8.4 tests/php/run.php
      - docker run --rm -v "$PWD":/app:ro -w /app {{.PHP81_IMAGE}} php tests/php/run.php

  test:db:
    desc: Migrations and settings storage against a throwaway MySQL 8.4 container (not the dev instance DB)
    cmd: tests/php/db/run.sh

  test:frontend:
    deps: [fe:install]
    dir: frontend
    cmd: npx vitest run

  test:package:
    desc: Builds the package twice in a temporary directory - reproducibility, content, unpacking by the vtlib importer of Vtiger 8.4.0 (VTIGER_SRC_REPO)
    cmd: python3 tests/package/test_package.py

  test:e2e:
    desc: Browser checks on the dev instance (CRM_URL) - loader, settings, switching on and off, network; run task crm:install first
    deps: [fe:install]
    dir: frontend
    cmd: MU_E2E_TARGET=dev npx playwright test --config e2e/playwright.config.ts --project modernui --project settings --project navigation --project records --project special --project layout --project foundation --project lists --project cloud-records --project cloud-forms --project cloud-settings --project settings-page --project auth-pages --project special-screens --project quality {{.CLI_ARGS}}

  test:e2e:clean:
    desc: Browser checks on the clean stand (both instances) after task clean:import-zip - pilot, other users, languages, Module Manager switch, network
    deps: [fe:install]
    dir: frontend
    cmds:
      - for: [c81, c85]
        cmd: MU_E2E_TARGET={{.ITEM}} npx playwright test --config e2e/playwright.config.ts --project clean --project modernui --project settings --project navigation --project records --project special --project layout --project foundation --project lists --project cloud-records --project cloud-forms --project cloud-settings --project settings-page --project auth-pages --project special-screens --project quality {{.CLI_ARGS}}

  test:layout:
    desc: 'Stage 09 prototype of the cloud layout (Accounts): no permanent module rail, record and edit form over the list, history, failures; MU_E2E_TARGET=dev|c81|c85 (default dev); writes and deletes synthetic organizations MU09'
    deps: [fe:install]
    dir: frontend
    cmd: MU_E2E_TARGET=${MU_E2E_TARGET:-dev} npx playwright test --config e2e/playwright.config.ts --project layout {{.CLI_ARGS}}

  test:foundation:
    desc: 'Stage 10 visual foundation against the measured cloud reference: tokens of the server = preview, reset to the cloud defaults, Poppins and the pinned Cyrillic face (offline), states of buttons, fields, Select2, check boxes, rows, menus, tabs, dialogs, notifications, the settings editor, densities, 200 %; MU_E2E_TARGET=dev|c81|c85 (default dev); report .local/e2e-reports/<stand>/foundation.json'
    deps: [fe:install]
    dir: frontend
    cmd: MU_E2E_TARGET=${MU_E2E_TARGET:-dev} npx playwright test --config e2e/playwright.config.ts --project foundation {{.CLI_ARGS}}

  test:cloud-records:
    desc: 'Stage 13 cloud records: native fields/actions, inline saves, related tabs, rights, history and failures; MU_E2E_TARGET=dev|c81|c85; creates/deletes synthetic MU13 records'
    deps: [fe:install]
    dir: frontend
    cmd: MU_E2E_TARGET=${MU_E2E_TARGET:-dev} npx playwright test --config e2e/playwright.config.ts --project cloud-records {{.CLI_ARGS}}

  test:cloud-forms:
    desc: 'Stage 14 cloud forms: native validation, pending save, recovery, context, custom CRUD and responsive layout; MU_E2E_TARGET=dev|c81|c85; synthetic MU14 records'
    deps: [fe:install]
    dir: frontend
    cmd: MU_E2E_TARGET=${MU_E2E_TARGET:-dev} npx playwright test --config e2e/playwright.config.ts --project cloud-forms {{.CLI_ARGS}}

  test:cloud-settings:
    desc: 'Stage 15 system settings: the catalog, search, navigation and inner pages against v7, dialogs, RU/EN/DE, widths, recovery; clean stand - restricted user and real changes (MU15 role, user, field, picklist value, workflow, deleted again); MU_E2E_TARGET=dev|c81|c85'
    deps: [fe:install]
    dir: frontend
    cmd: MU_E2E_TARGET=${MU_E2E_TARGET:-dev} npx playwright test --config e2e/playwright.config.ts --project cloud-settings {{.CLI_ARGS}}

  test:settings-page:
    desc: 'Stage 16 page of ModernUI and personal preferences: one title, sections, scope before changes, inherited/own values, preview/cancel/reset, scope switch with a draft, conflict carried over, draft kept over a reload, menu editor (search, catalog, drag onto a group, keys, empty/unknown) and the real mega menu, preferences, U on the clean stand, RU/EN/DE, widths, 200 %, keyboard, no JavaScript; MU_E2E_TARGET=dev|c81|c85'
    deps: [fe:install]
    dir: frontend
    cmd: MU_E2E_TARGET=${MU_E2E_TARGET:-dev} npx playwright test --config e2e/playwright.config.ts --project settings-page {{.CLI_ARGS}}

  test:auth-pages:
    desc: 'Opt-in login and password recovery: installation/restoration, native forms, logo, notice, RU/EN/DE, no JavaScript, widths and permissions; MU_E2E_TARGET=dev|c81|c85; private screenshots via MU_AUTH_SHOTS_DIR'
    deps: [fe:install]
    dir: frontend
    cmd: MU_E2E_TARGET=${MU_E2E_TARGET:-dev} npx playwright test --config e2e/playwright.config.ts --project auth-pages {{.CLI_ARGS}}

  test:lists:
    desc: 'Stage 12 cloud lists: geometry, filters, native request and selection parity, RU/EN/DE, narrow screens and restricted user; MU_E2E_TARGET=dev|c81|c85; private screenshots via MU_LIST_SHOTS_DIR'
    deps: [fe:install]
    dir: frontend
    cmd: MU_E2E_TARGET=${MU_E2E_TARGET:-dev} npx playwright test --config e2e/playwright.config.ts --project lists {{.CLI_ARGS}}

  test:special-screens:
    desc: 'Stage 17 special screens against v7: calendar (colours, views, panel switch), dashboard, reports (folders, result, exports, wizard), import, recycle bin, find duplicates, email templates, mail manager, widths/200 %/RU EN DE, no JavaScript; MU_E2E_TARGET=dev|c81|c85'
    deps: [fe:install]
    dir: frontend
    cmd: MU_E2E_TARGET=${MU_E2E_TARGET:-dev} npx playwright test --config e2e/playwright.config.ts --project special-screens {{.CLI_ARGS}}

  test:quality:
    desc: 'Stage 19 quality - POST/CSRF/Referer of every changing action, errors without leaks, uploads, import, isolation of users, strict CSP, failures and recovery, axe-core, keyboard, reduced motion, German; MU_E2E_TARGET=dev|c81|c85'
    deps: [fe:install]
    dir: frontend
    cmd: MU_E2E_TARGET=${MU_E2E_TARGET:-dev} npx playwright test --config e2e/playwright.config.ts --project quality {{.CLI_ARGS}}

  test:stability:
    desc: 'Stage 19 - 40 cycles of list, record, edit, related tab, history and menu in one document; AJAX list reloads against v7 (MU_STABILITY_CYCLES); MU_E2E_TARGET=dev|c81|c85'
    deps: [fe:install]
    dir: frontend
    cmd: MU_E2E_TARGET=${MU_E2E_TARGET:-dev} npx playwright test --config e2e/playwright.config.ts --project stability {{.CLI_ARGS}}

  test:browsers:
    desc: 'Stage 19 - the core scenarios of the theme in Chromium, Firefox and WebKit of the pinned Playwright (npx playwright install firefox webkit once); clean stand, MU_E2E_TARGET=c81|c85'
    deps: [fe:install]
    dir: frontend
    cmd: MU_E2E_TARGET=${MU_E2E_TARGET:-c81} npx playwright test --config e2e/playwright.config.ts --project browsers-chromium --project browsers-firefox --project browsers-webkit {{.CLI_ARGS}}

  visual:pairs:
    desc: 'Screens and measurements of ModernUI for the states of dev/visual/states.json into MU_VISUAL_DIR (dev instance - a private directory), read-only; MU_E2E_TARGET=dev|c81|c85'
    deps: [fe:install]
    dir: frontend
    cmd: MU_E2E_TARGET=${MU_E2E_TARGET:-dev} npx playwright test --config e2e/playwright.config.ts --project pairs {{.CLI_ARGS}}

  visual:compare:
    desc: 'Pairs and geometry table against the pinned cloud reference - MU_VISUAL_REFERENCE (private directory of the reference) and MU_VISUAL_DIR (output of visual:pairs)'
    cmd: python3 dev/visual/compare.py --reference "$MU_VISUAL_REFERENCE" --candidate "$MU_VISUAL_DIR" {{.CLI_ARGS}}

  visual:capture:
    desc: 'Capture deterministic visual regions on a seeded clean PACKAGE instance only; never updates accepted images'
    deps: [fe:install]
    dir: frontend
    cmd: MU_E2E_TARGET=${MU_E2E_TARGET:-c81} npx playwright test --config e2e/playwright.config.ts --project visual-regression {{.CLI_ARGS}}

  visual:regression:
    desc: 'Capture and compare with reviewed clean-instance images; fails on missing evidence or unexplained differences'
    cmds:
      - task: visual:capture
      - python3 dev/visual/regression.py --candidate "${MU_REGRESSION_DIR:-.local/visual-regression/${MU_E2E_TARGET:-c81}}"

  test:visual-tools:
    desc: Verify that the visual comparison gates fail on missing evidence and real differences
    cmd: python3 -m unittest discover -s tests -p 'visual_*_test.py'

  test:screens:
    desc: 'Every screen of the instance with and without the theme (stage 08, read-only): lost or covered actions, new errors, scrolling, level of the theme; MU_E2E_TARGET=dev|c81|c85 (default dev), MU_SCREENS=prefixes, MU_SCREENS_EXTRA=<json of more screens>, MU_SCREENS_SHOTS_DIR (dev: private directory)'
    deps: [fe:install]
    dir: frontend
    cmd: MU_E2E_TARGET=${MU_E2E_TARGET:-dev} npx playwright test --config e2e/playwright.config.ts --project screens {{.CLI_ARGS}}

  baseline:
    desc: 'Behaviour of the CRM screens without the theme (metrics only) into .local/e2e-reports/<target>/; MU_E2E_TARGET=dev|c81|c85, default dev (safe mode on)'
    deps: [fe:install]
    dir: frontend
    cmd: MU_E2E_TARGET=${MU_E2E_TARGET:-dev} MU_BASELINE_SAFE_MODE=${MU_BASELINE_SAFE_MODE:-1} npx playwright test --config e2e/playwright.config.ts --project baseline {{.CLI_ARGS}}

  shots:
    desc: 'Screenshots of the main screens at 1440/1024/768/412 px with and without the theme into MU_SHOTS_DIR (required for dev: private directory; clean stand: .local/shots/<target>/)'
    deps: [fe:install]
    dir: frontend
    cmd: MU_E2E_TARGET=${MU_E2E_TARGET:-dev} npx playwright test --config e2e/playwright.config.ts --project visual {{.CLI_ARGS}}

  measure:
    desc: 'Cost of the theme against safe mode (timings, CLS, bytes, Bootstrap time and 304) and transition delays, with the budgets of stage 19, into .local/e2e-reports/<target>/measure-<label>.json and transitions-<label>.json'
    deps: [fe:install]
    dir: frontend
    cmd: MU_E2E_TARGET=${MU_E2E_TARGET:-dev} npx playwright test --config e2e/playwright.config.ts --project measure {{.CLI_ARGS}}

  test:devcycle:
    desc: 'Edit → result on the dev instance: temporary edits of PHP, Smarty, a PHP dictionary, CSS and Vue (own watcher), a compile error; all undone'
    deps: [fe:install]
    dir: frontend
    cmd: MU_E2E_TARGET=dev npx playwright test --config e2e/playwright.config.ts --project devcycle

  test:devrecord:
    desc: 'A synthetic Calendar task through the standard form with the theme on: task test:devrecord -- create | delete:<id> (check the integrations of the instance first)'
    deps: [fe:install]
    dir: frontend
    cmd: MU_E2E_TARGET=dev MU_DEVRECORD={{.CLI_ARGS}} npx playwright test --config e2e/playwright.config.ts --project devrecord

  clean:up:
    desc: 'Clean Vtiger 8.4.0 stand (dev/clean): build the images, start, unpack the official release archive (SHA-256 checked) into new volumes'
    cmd: dev/clean/clean.sh up

  clean:install:
    desc: Run the standard web installer of each clean instance that is not installed (new empty databases); turn on the strict PHP log
    deps: [fe:install]
    cmd: dev/clean/clean.sh install

  clean:seed:
    desc: Synthetic roles, users (restricted, view-all, second admin), records with line items, the test entity module Gadgets (Module Manager)
    deps: [fe:install]
    cmd: dev/clean/clean.sh seed

  clean:status:
    desc: Containers, URLs, PHP and Vtiger versions, ModernUI registration and files of each clean instance
    cmd: dev/clean/clean.sh status

  clean:import-zip:
    desc: 'ModernUI ZIP (default dist/ModernUI-<VERSION>.zip) into every clean instance through Settings → Module Manager → Import'
    deps: [fe:install]
    cmd: dev/clean/clean.sh import-zip {{.CLI_ARGS}}

  clean:uninstall:
    desc: Remove ModernUI from the clean instances like an administrator - vtlib console --remove, then the module files; settings tables stay
    cmd: dev/clean/clean.sh uninstall

  clean:verify:
    desc: 'NEW clean stand (deletes its data) and the whole PACKAGE check of a ZIP: install, import, scenarios, update, uninstall, reinstall, hashes, PHP log'
    deps: [fe:install]
    cmd: dev/clean/clean.sh verify {{.CLI_ARGS}}

  clean:hash:
    desc: 'SHA-256 of the CRM code files of each clean instance: task clean:hash -- <label>'
    cmd: dev/clean/clean.sh hash {{.CLI_ARGS}}

  clean:meta:
    desc: 'Metadata of the clean databases (tabs, global links, settings items, tables, roles, users): task clean:meta -- <label>'
    cmd: dev/clean/clean.sh meta {{.CLI_ARGS}}

  clean:logs:
    desc: PHP messages of the clean instances (logs/phperr.log), grouped by type and file; messages in ModernUI files listed
    cmd: dev/clean/clean.sh logs {{.CLI_ARGS}}

  clean:verify-source:
    desc: Compare the release archive of 8.4.0 with the tag 8.4.0 of VTIGER_SRC_REPO
    cmd: dev/clean/clean.sh verify-source

  clean:down:
    desc: Stop the clean stand; the volumes (CRM code and databases) stay
    cmd: dev/clean/clean.sh down

  clean:reset:
    desc: Stop the clean stand and DELETE its volumes (new empty databases next time)
    cmd: dev/clean/clean.sh reset

  crm:link:
    desc: 'Connect src/ to the CRM stand (read-only bind mounts, language stubs, git excludes); task crm:link -- --force moves a ZIP-installed copy aside'
    cmd: dev/crm-link.sh link {{.CLI_ARGS}}

  crm:unlink:
    desc: Disconnect src/ from the CRM stand; the stand DB and the module registration stay
    cmd: dev/crm-link.sh unlink

  crm:status:
    desc: Stand version and git HEAD, state of every mapped path, module registration in the stand DB
    cmd: dev/crm-link.sh status

  crm:smoke:
    desc: Smoke test of the CRM stand itself (its own task smoke - admin login, a few pages, PHP-FPM log)
    cmd: dev/crm-link.sh smoke

  crm:install:
    desc: First registration in the stand DB through the Module Manager code (Vtiger_Package::import of the ZIP), then link src/ again
    cmds:
      - task: package
      - task: crm:vtlib
        vars: { ACTION: 'import {{.ZIP}}' }

  crm:update:
    desc: Update of the registration through Vtiger_Package::update of a fresh ZIP (runs the settings migrations), then link src/ again
    cmds:
      - task: package
      - task: crm:vtlib
        vars: { ACTION: 'update {{.ZIP}}' }

  crm:vtlib:
    internal: true
    cmds:
      - dev/crm-link.sh unlink
      - defer: dev/crm-link.sh link --force
      - '{{.CRM_PHP}} dev/crm-vtlib.php "{{.CRM_ROOT}}" {{.ACTION}}'

  crm:import-zip:
    desc: 'PACKAGE run on the dev instance: unlink src/, then the ZIP (default dist/ModernUI-<VERSION>.zip) through Settings → Module Manager → Import; back to DEV with task crm:link -- --force'
    deps: [fe:install]
    cmds:
      - dev/crm-link.sh unlink
      # PHP-FPM workers keep the unmounted files in OPcache until the next revalidation (revalidate_freq, usually 2 s):
      # a page in that window fails on require_once of the link handler. Wait before opening the Module Manager (the import
      # scenario also retries the page for up to 45 s: once the window lasted longer, stage 08).
      - sleep 5
      - cd frontend && MU_E2E_TARGET=dev MU_IMPORT_ZIP={{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}{{.ZIP}}{{end}} npx playwright test --config e2e/playwright.config.ts --project import
      - dev/crm-link.sh status

  crm:uninstall:
    desc: Vtiger_Module::delete() of ModernUI - links and the settings item go, settings tables stay; task crm:uninstall -- --purge drops them
    cmd: '{{.CRM_PHP}} dev/crm-vtlib.php "{{.CRM_ROOT}}" remove {{.CLI_ARGS}}'

  crm:enable:
    desc: Enable ModernUI as the Module Manager does (module.enabled event)
    cmd: '{{.CRM_PHP}} dev/crm-vtlib.php "{{.CRM_ROOT}}" toggle on'

  crm:disable:
    desc: Disable ModernUI as the Module Manager does (module.disabled event)
    cmd: '{{.CRM_PHP}} dev/crm-vtlib.php "{{.CRM_ROOT}}" toggle off'

  privacy:
    desc: Check that files to be published contain no installation-specific information (patterns in the untracked PRIVATE.md)
    cmd: dev/check-private.sh
